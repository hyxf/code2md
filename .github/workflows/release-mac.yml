name: Build Universal macOS DMG (code2md)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-universal:
    name: Build Universal DMG
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.2.0"

      - name: Verify Xcode
        run: xcodebuild -version

      # Intel 架构
      - name: Build x86_64
        run: |
          xcodebuild \
            -scheme code2md \
            -configuration Release \
            -derivedDataPath build-x64 \
            -destination "platform=macOS,arch=x86_64" \
            clean build

      # Apple Silicon 架构
      - name: Build arm64
        run: |
          xcodebuild \
            -scheme code2md \
            -configuration Release \
            -derivedDataPath build-arm64 \
            -destination "platform=macOS,arch=arm64" \
            clean build

      # 合并 Universal
      - name: Create Universal App
        run: |
          APP_NAME="code2md.app"
          EXEC_NAME="code2md"

          X64_APP="build-x64/Build/Products/Release/$APP_NAME"
          ARM_APP="build-arm64/Build/Products/Release/$APP_NAME"

          UNIVERSAL_DIR="dist"
          UNIVERSAL_APP="$UNIVERSAL_DIR/$APP_NAME"

          rm -rf "$UNIVERSAL_DIR"
          mkdir -p "$UNIVERSAL_DIR"

          # 用 arm64 结构
          cp -R "$ARM_APP" "$UNIVERSAL_APP"

          # 合并二进制
          lipo -create \
            "$X64_APP/Contents/MacOS/$EXEC_NAME" \
            "$ARM_APP/Contents/MacOS/$EXEC_NAME" \
            -output "$UNIVERSAL_APP/Contents/MacOS/$EXEC_NAME"

          # 验证
          lipo -archs "$UNIVERSAL_APP/Contents/MacOS/$EXEC_NAME"

      # ⭐ 设置 Volume Icon（桌面挂载图标）
      - name: Setup Volume Icon
        run: |
          APP_PATH="dist/code2md.app"
          ICON_DIR="$APP_PATH/Contents/Resources"

          # 自动找 icns
          ICNS_FILE=$(find "$ICON_DIR" -name "*.icns" | head -n 1)

          if [ -z "$ICNS_FILE" ]; then
            echo "❌ No .icns found"
            exit 1
          fi

          echo "✅ Using icon: $ICNS_FILE"

          # 生成 VolumeIcon
          cp "$ICNS_FILE" dist/.VolumeIcon.icns

          # 设置 Finder 标志（关键）
          SetFile -c icnC dist/.VolumeIcon.icns
          SetFile -a C dist

          ls -la dist

      - name: Install create-dmg
        run: brew install create-dmg

      # 🚀 创建 DMG（带专业配置）
      - name: Create Universal DMG
        run: |
          DMG_NAME="code2md-macOS-universal.dmg"

          # （可选）DMG 文件本身 icon
          cp dist/.VolumeIcon.icns dmg.icns

          create-dmg \
            --volname "code2md" \
            --window-size 700 400 \
            --icon-size 120 \
            --icon "code2md.app" 180 170 \
            --hide-extension "code2md.app" \
            --app-drop-link 520 170 \
            --volicon dmg.icns \
            --format UDZO \
            --no-internet-enable \
            "$DMG_NAME" \
            "dist"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: code2md-macOS-universal.dmg
